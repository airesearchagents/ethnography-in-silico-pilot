ceo_task:
  description: >
    Leverage your knowledge of {company}'s current strategy and product lines.
    Develop a strategy for {product_type} product under the context -
    {context} for the year {current_year} aligned with the overall 
    long term strategy.
    Name the new product you want to create and describe it in detail.
    Use only {company} websites or open-source version control websites for
    gathering data.
    You must document what were your previous strategies and if there are any 
    new changes in the strategies with respect to open or closed modes of 
    development.
    Provide your reasons for the decisions you make.
    Avoid multimedia or non-text links in your search for information.
    If you cannot complete this task alone, split the task and delegate the 
    subtasks to another agent and integrate their inputs for your task.
    Be as detailed as possible in your responses to others and tune your 
    responses to the strategic vision you have created for the company 
    and product.
    You always cite your sources at the end of your response.
  expected_output: >
    1. Create a detailed document about your company and product strategy. 
    2. Create a detailed document about the estimated future benefits to the
    firm and your reasons for the same.
    3. Document your major and minor strategic decisions, any dilemmas or 
    tensions related to open or closed source development or research, 
    participation in collaboration or competition or coopetition, their 
    benefits to the company, and the reasons for your decisions.
    Create the output files with your full task output from a CEO perspective.
    Do not add your thinking process or reasoning in the output files.
    Do not output in json format.
    Do not add any final summary or analysis at the end.
    Format as Markdown file, but without '```'.
  agent: ceo

