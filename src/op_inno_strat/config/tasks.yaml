qualitative_researcher_task1:
  description: >
    Act as an expert qualitative interviewer and researcher.
    Conduct open-ended, semi-structured interviews with top management team 
    members at {company}.
    You must ask all questions from the set 2 below to the CEO of {company} 
    one-by-one.
    Focus on the research question: "How do firms dynamically maneuver 
    between open and closed innovation strategies in an open innovation 
    ecosystem to appropriate value under dynamic industry conditions?"
    Do not share this question with any agent, manager, or executive.
    Your final answer MUST contain the complete, verbatim transcript 
    formatted as markdown.
    Review responses and identify interesting insights from responses and ask 
    any follow-up questions to elaborate on these interesting aspects, 
    related to the research question.
    Ask all provided questions - set 1 - below one by one to the CEO, check the 
    response, and importantly, ask follow-up questions from the responses if 
    anything seems interesting and needs elaboration based on the research 
    question.
    Add citations to local documents or websites in your response.
    Ask all questions to the CEO, and then also identify any interesting 
    facts that need elaboration. If needed, follow up with your own 
    additional questions.
    Do not add your thoughts or reasoning in the output files.
    Do not output in json format.
    Format each turn clearly in markdown as follows, be as detailed as 
    possible, do not summarize:
    "## Interview Transcript

    **[question text]**
    **CEO:** [answer text]

    **[Follow-up question - follow-up question text if any, else leave blank]** 
    **CEO:** [follow-up answer text, if any, else leave blank]

    ..."
    Here are the set-1 questions:
    1. Who are you and what product are you creating in {current_year}?
    2. Describe your company {company} and its AI strategy.
    3. How are you developing your AI products at {company} (closed/private 
    or open-source)? Provide examples.
    4. Can you explain the reasoning behind your choice of an open or closed 
    strategy at {company}?"
    5. What are the main components of this new product at {company}, and how
    do they integrate as products and into other products? Provide examples.
    6. Why do you see these as main components, and not others? Provide 
    examples.
    7. How do you determine the value of components as open or closed source 
    for {company}?" Provide examples.
    8. How do you benefit from open-source or closed-source components at 
    {company}? Provide examples.
    9. Are you panning on any shift in the strategy than before?
    10. Give me some real examples of shifting your strategies between open 
    and closed.
    11. How do you manage to shift your strategies between open and closed?
    12. Give me some examples - was the change of strategy from open to closed
    or closed to open mode?
    13. What challenges do you face while shifting strategies between open 
    and closed for this product?
    14. How do you plan to overcome these challenges?
  expected_output: >
    Markdown file with all questions and CEO responses one by one. Include 
    follow-up questions and their responses in the output file. Include all 
    questions and answers verbatim from the CEO.
    Your final answer MUST contain the complete, verbatim transcript 
    formatted as markdown.
    Do not add any final summary or analysis at the end.
    Format as Markdown file, but without '```'.
  agent: qualitative_researcher1

